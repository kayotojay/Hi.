<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hi. Missed. You.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;cursor:pointer;outline:none}
  #word{position:fixed;top:9vh;left:0;right:0;text-align:center;pointer-events:none;
    font-family:"Jost","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:100;font-size:clamp(30px,5vw,54px);letter-spacing:.32em;text-indent:.32em;
    color:#fff;opacity:0;transform:translateY(8px);transition:opacity .55s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
  #word.on{opacity:.95;transform:none}
  #hint{position:fixed;left:0;right:0;bottom:4vh;text-align:center;pointer-events:none;font-size:11px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.4)}
  #hint .txt{display:block;transition:opacity .3s ease}
  #hint .txt.swap{opacity:0}
  #dots{display:none}
</style>
</head>
<body>
<div id="word"></div>
<canvas id="c" tabindex="0" aria-label="A lilac flower. Click to bloom."></canvas>
<div id="hint"><span class="txt" id="hintTxt">Click the flower to bloom</span><div id="dots"><i></i><i></i><i></i></div></div>

<script>
(()=>{
const TAU=Math.PI*2;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const smooth=t=>t*t*(3-2*t);
const easeIO=t=>0.5-0.5*Math.cos(Math.PI*t);
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

/* ---------- colours: bud green -> cream -> lily pink ---------- */
const hsl2rgb=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]};
const GRN=[162,192,112],CRM=[234,226,184],PNK=[238,150,184],DEEP=[214,96,146],LITE=[252,208,224],THR=[204,216,130];

/* ---------- petals (6 tepals: 3 outer, 3 inner) ---------- */
const NP=6,NU=20,NV=14,NVERT=(NU+1)*(NV+1);
const petals=[];
for(let i=0;i<NP;i++){
  const B=i%2;
  petals.push({
    id:i,a:i/NP*TAU+0.2,B,
    len:B?1.0:1.12, wid:B?0.23:0.3,
    delay:B?0.3:(i%4===0?0:0.05),
    closedPhi:B?0.42:0.5,ck:B?-0.9:-1.0, openPhi:B?1.15:1.0,ko:0.2,
    ph:Math.random()*TAU,rv:Math.random(),qb:0,vb:0,qt:0,vt:0,tgt:0,pend:0,tgtAt:null,kb:0,cb:7.5,kt:18,ct:3.4,
    wx:new Float32Array(NVERT),wy:new Float32Array(NVERT),wz:new Float32Array(NVERT),
    sx:new Float32Array(NVERT),sy:new Float32Array(NVERT),zc:new Float32Array(NVERT),cc:new Float32Array(NVERT*3)
  });
}
for(const p of petals){p.kb=p.kb0=34*(0.9+0.2*p.rv);p.kt=p.kt0=17*(0.9+0.2*p.rv);p.cb=6.2;p.ct=3.0}
for(const p of petals){const g={};for(let n=0;n<34;n++){const u=0.07+0.55*Math.pow(Math.random(),1.8),v=(Math.random()+Math.random()-1)*0.62;
  const j=Math.min(NU-1,Math.floor(u*NU)),i=Math.min(NV-1,Math.floor((v+1)/2*NV)),key=j*NV+i;
  (g[key]=g[key]||[]).push({fu:u*NU-j,fv:(v+1)/2*NV-i,f:1-(u-0.07)/0.55,s:0.75+Math.random()*0.5})}p.fr=g}
const punch={q:0,v:0};let punchAt=null;
const NS=6;
const stamens=[];
for(let s=0;s<NS;s++)stamens.push({k:s,b:s/NS*TAU+0.5,th:0.12+Math.random()*0.18,len:0.42+Math.random()*0.1,ph:Math.random()*TAU});
stamens.push({b:0,th:0.06,len:0.6,pistil:true,ph:1});

/* ---------- state ---------- */
let E=0,Et=0,camE=0,stage=0;
const targets=[0,0.35,0.6,0.82,1];
const dots=[...document.querySelectorAll('#dots i')];
const hintTxt=document.getElementById('hintTxt');
const hints=['Click the flower to bloom','Keep clicking…','Keep clicking…','Keep clicking…','Click once more to close, then bloom it again'];
const WORDS=['','Hi.','Missed.','You.','<3 T'];
const wordEl=document.getElementById('word');
let wTimer=null;
function showWord(txt){
  clearTimeout(wTimer);wordEl.classList.remove('on');
  if(!txt)return;
  wTimer=setTimeout(()=>{wordEl.textContent=txt;wordEl.classList.add('on')},stage===1?150:stage===4?560:420);
}
let hintTimer=null;
function setHint(t){
  hintTxt.classList.add('swap');clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{hintTxt.textContent=t;hintTxt.classList.remove('swap')},300);
}
function setGoal(g,pop){
  const now=performance.now();
  for(const p of petals){
    if(pop){p.kb=p.kb0*1.7;p.cb=5.2;p.kt=p.kt0*1.7;p.ct=2.4;p.tgt=0.08;p.pend=1.04;p.tgtAt=now+300+p.delay*260+p.rv*60}
    else if(g===0){p.kb=p.kb0*0.55;p.cb=6.5;p.kt=p.kt0*1.6;p.ct=5.5;p.pend=0;p.tgtAt=now+(p.B?0:140)+p.rv*60}
    else{p.kb=p.kb0;p.cb=6.2;p.kt=p.kt0;p.ct=3.0;p.pend=smooth(clamp(g*1.3-p.delay));p.tgtAt=now+p.delay*500+p.rv*70}
  }
  if(pop)punchAt=now+300;
}
function advance(){
  beeClick();
  stage=(stage+1)%5;
  setGoal(targets[stage],stage===4);
  showWord(WORDS[stage]);
  dots.forEach((d,i)=>d.classList.toggle('on',i<stage));
  setHint(hints[stage]);
}
document.addEventListener('click',advance);
cv.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();advance()}});

/* ---------- bees ---------- */
let leafC=null,stemPts=null,textR=null,dtG=0.016,beeIdle=0,beeWait=5+Math.random()*4;
const bees=[],hearts=[],evt={ph:'none',t:0,dur:0,lucky:false,hh:false,cool:10};
const newBee=(x,y,ang)=>({st:'in',x,y,vx:0,vy:0,ang,age:0,stay:0,tg:null,wp:[],ph:Math.random()*TAU,sgn:1,fp:0,fl:0,nf:2,walking:false,wt:1,wdir:1,wph:0,ht:0,ox:1,oy:-0.3,dead:false,hold:false,life:18+Math.random()*18});
const samp=(a,s)=>{const n=a.length-1,f=clamp(s,0,1)*n,i0=Math.min(n-1,Math.floor(f)),u=f-i0;
  return[a[i0][0]+(a[i0+1][0]-a[i0][0])*u,a[i0][1]+(a[i0+1][1]-a[i0][1])*u,Math.atan2(a[i0+1][1]-a[i0][1],a[i0+1][0]-a[i0][0])]};
const wordEl2=document.getElementById('word');
function updText(){
  textR=null;
  if(!wordEl2.classList.contains('on')||!wordEl2.textContent)return;
  const r=document.createRange();r.selectNodeContents(wordEl2);const b=r.getBoundingClientRect();
  if(b.width>0)textR={l:b.left,r:b.right,y:b.top+b.height*0.27};
}
// where a perch target is right now (screen space), so the bee follows the flower's sway
function pos(g,sc){
  if(g.k==='leaf'&&leafC){const q=samp(leafC,g.s);return{x:q[0],y:q[1],a:q[2]}}
  if(g.k==='stem'&&stemPts){const q=samp(stemPts,g.s);return{x:q[0],y:q[1],a:q[2]}}
  if(g.k==='text')return textR?{x:g.x,y:textR.y-sc*0.9,a:0}:null;
  if(g.k==='p'){
    const p=petals[g.p];
    const at=(j,i)=>{const j0=Math.min(NU-1,Math.floor(j)),i0=Math.min(NV-1,Math.floor(i)),fj=j-j0,fi=i-i0,A=j0*(NV+1)+i0,B=A+1,D=A+NV+1,C=D+1;
      return[(p.sx[A]*(1-fi)+p.sx[B]*fi)*(1-fj)+(p.sx[D]*(1-fi)+p.sx[C]*fi)*fj,(p.sy[A]*(1-fi)+p.sy[B]*fi)*(1-fj)+(p.sy[D]*(1-fi)+p.sy[C]*fi)*fj]};
    const a=at(g.j-0.5,g.i),b=at(g.j+0.5,g.i),c=at(g.j,g.i);
    return{x:c[0],y:c[1],a:Math.atan2(b[1]-a[1],b[0]-a[0])};
  }
  return null;
}
function beePick(b){
  const r=Math.random();
  if(stemPts&&r<0.2)b.tg={k:'stem',s:0.12+Math.random()*0.25,down:Math.random()<0.6};
  else if(textR&&r<0.4)b.tg={k:'text',x:textR.l+(textR.r-textR.l)*(0.1+0.8*Math.random())};
  else if(leafC&&r<0.62)b.tg={k:'leaf',s:0.2+Math.random()*0.5};
  else{
    const c=[];
    for(let n=0;n<NP;n++){
      const j=stage===0?8:11+((Math.random()*5)|0),i=stage===0?7:4+((Math.random()*7)|0);
      c.push({k:'p',p:n,j,i,z:petals[n].zc[j*(NV+1)+i]});
    }
    c.sort((a,b)=>a.z-b.z);b.tg=c[(Math.random()*3)|0];
  }
  b.sgn=Math.random()<0.5?1:-1;
}
// short on-screen flit (sometimes a quick pass past an edge, or a dive down into the dark below the stem)
function beeFlit(b){
  const sc=H*0.011,cx=W/2,cy=H*0.43,wp=[],n=2+((Math.random()*2)|0);
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,r=H*(0.16+Math.random()*0.22);
    wp.push([clamp(cx+Math.cos(a)*r*1.2,sc*4,W-sc*4),clamp(cy+Math.sin(a)*r*0.8,H*0.2,H*0.8)]);
  }
  const r=Math.random();
  if(r<0.15&&stemPts)wp.push([stemPts[stemPts.length-1][0],H+sc*6,true]);
  else if(r<0.35){const L=Math.random()<0.5;wp.splice(1,0,[L?-sc*6:W+sc*6,H*(0.15+Math.random()*0.4)])}
  b.wp=wp;b.st='flit';b.walking=false;
}
function beeClick(){
  if(!bees.length){beeIdle=0;return}
  for(const b of bees)if(b.st==='in'||b.st==='perch')beeFlit(b);
}
function fin(b,dt,want){
  const da=((want-b.ang+Math.PI*3)%TAU)-Math.PI;
  b.ang+=da*clamp(dt*(b.st==='perch'?10:6));
  b.fp+=dt*(b.st==='perch'?(b.fl>0?50:0):62);
  if(b.walking&&b.st==='perch')b.wph+=dt*11;
}
function walk(b,dt,sc){
  const g=b.tg,d=b.wdir;
  if(g.k==='p'){const lo=stage===0?7:9,hi=stage===0?11:17;g.j+=d*2*dt;if(g.j<lo||g.j>hi){g.j=clamp(g.j,lo,hi);b.wdir=-d}}
  else if(g.k==='leaf'){g.s+=d*0.1*dt;if(g.s<0.1||g.s>0.9){g.s=clamp(g.s,0.1,0.9);b.wdir=-d}}
  else if(g.k==='text'&&textR){g.x+=d*sc*5*dt;const lo=textR.l+sc*2,hi=textR.r-sc*2;if(g.x<lo||g.x>hi){g.x=clamp(g.x,lo,hi);b.wdir=-d}}
  else if(g.k==='stem'){g.s+=d*0.09*dt;if(g.s<0.03||g.s>1){g.s=clamp(g.s,0.03,1);b.wdir=-d}}
}
function playStep(b,n,dt,sc,vmax){
  const cx=W/2,cy=H*0.4,tt=evt.t;let tx,ty,want,mul=1;
  if(evt.ph==='kiss'){tx=cx+(n?1:-1)*sc*1.9;ty=cy-H*0.14+Math.sin(tt*6+n)*sc*0.25;want=n?Math.PI:0}
  else if(evt.kind==='dance'){
    const th=tt*2.6+n*Math.PI,R=H*(0.07+0.04*Math.sin(tt*1.3)),mx=cx+H*0.2*Math.sin(tt*0.5),my=cy-H*0.08+H*0.06*Math.sin(tt*0.8);
    tx=mx+R*1.5*Math.cos(th);ty=my+R*Math.sin(th);
  }else if(evt.kind==='tag'){
    const o=bees[1-n];
    if(n===evt.lead){
      if(evt.px===null||Math.hypot(b.x-evt.px,b.y-evt.py)<sc*3){evt.px=W*(0.15+Math.random()*0.7);evt.py=H*(0.18+Math.random()*0.5)}
      tx=evt.px;ty=evt.py;
    }else{
      tx=o.x;ty=o.y;mul=1.35;
      if(tt>evt.sw&&Math.hypot(o.x-b.x,o.y-b.y)<sc*2.5){evt.lead=n;evt.px=null;evt.sw=tt+1.3}   // tagged: roles swap
    }
  }else{
    const th=tt*1.5-n*1.1,R=H*(0.2+0.04*Math.sin(tt*0.9));
    tx=cx+R*1.35*Math.cos(th)+H*0.04*Math.sin(tt*3.1+n);ty=cy-H*0.08+R*0.75*Math.sin(th*1.3+0.5);
  }
  const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)+1e-3,sp=Math.min(vmax*1.15*mul,d*3.2),wob=Math.sin(t*9+b.ph)*vmax*0.12,k=clamp(dt*6);
  b.vx+=(dx/d*sp-dy/d*wob-b.vx)*k;b.vy+=(dy/d*sp+dx/d*wob-b.vy)*k;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  fin(b,dt,want===undefined?Math.atan2(b.vy,b.vx):want);
}
function endEvent(){
  evt.ph='none';evt.cool=12+Math.random()*13;
  const A=bees[0],B=bees[1];
  if(A){A.hold=false;beeFlit(A)}
  if(B){B.hold=false;B.st='leave';B.ox=B.x<W/2?-1:1;B.oy=-0.25}
}
function beeEvents(dt){
  const sc=H*0.011,A=bees[0],B=bees[1];
  if(evt.ph==='none'){
    evt.cool-=dt;
    if(bees.length===1&&A.age>6&&A.age<A.life-10&&evt.cool<0&&(A.st==='perch'||A.st==='flit'||A.st==='in')&&Math.random()<dt*0.12){
      evt.ph='play';evt.t=0;evt.dur=7+Math.random()*4;evt.lucky=Math.random()<0.5;evt.hh=false;
      evt.kind=['chase','dance','tag','together'][(Math.random()*4)|0];evt.lead=0;evt.sw=1;evt.px=null;
      const L=Math.random()<0.5,N=newBee(L?-sc*3:W+sc*3,H*(0.15+Math.random()*0.4),L?0:Math.PI);
      bees.push(N);A.walking=false;
      if(evt.kind==='together'){   // both land side by side, walk about, maybe a heart
        beePick(A);const g=A.tg;g.down=false;N.tg=Object.assign({},g);
        if(g.k==='p')N.tg.j=g.j+1.5;else if(g.k==='text')N.tg.x=g.x+sc*4;else N.tg.s=g.s+0.08;
        A.st='in';A.hold=N.hold=true;A.sgn=1;N.sgn=-1;evt.dur=8+Math.random()*3;
      }else{A.st='play';N.st='play'}
    }
  }else{
    evt.t+=dt;
    if(evt.kind==='together'){
      if(evt.lucky&&!evt.hh&&evt.t>evt.dur*0.55&&B&&A.st==='perch'&&B.st==='perch'){evt.hh=true;hearts.push({x:(A.x+B.x)/2,y:Math.min(A.y,B.y)-sc*3,t:0})}
      if(evt.t>evt.dur)endEvent();
    }else if(evt.ph==='play'&&evt.t>evt.dur){if(evt.lucky){evt.ph='kiss';evt.t=0}else endEvent()}
    else if(evt.ph==='kiss'){
      if(!evt.hh&&evt.t>1.1){evt.hh=true;hearts.push({x:W/2,y:H*0.4-H*0.14-sc*2.6,t:0})}
      if(evt.t>2.8)endEvent();
    }
  }
}
function beeStep(dt){
  const sc=H*0.011,vmax=0.5*Math.min(W,H);
  updText();
  if(!bees.length){
    beeIdle+=dt;
    if(beeIdle>beeWait){
      const L=Math.random()<0.5,b=newBee(L?-sc*3:W+sc*3,H*(0.12+Math.random()*0.45),L?0:Math.PI);
      b.vx=(L?1:-1)*vmax*0.5;beePick(b);bees.push(b);
    }
    return;
  }
  beeEvents(dt);
  for(let n=0;n<bees.length;n++)stepBee(bees[n],n,dt,sc,vmax);
  for(let n=bees.length-1;n>=0;n--)if(bees[n].dead)bees.splice(n,1);
  if(!bees.length){beeIdle=0;beeWait=6+Math.random()*8}
}
function stepBee(b,n,dt,sc,vmax){
  const k=clamp(dt*4);let want=b.ang;b.age+=dt;
  if(b.st==='hid'){b.ht-=dt;if(b.ht<0){b.x=stemPts?stemPts[stemPts.length-1][0]:W/2;b.y=H+sc*4;b.vx=b.vy=0;beeFlit(b)}return}
  if(n===0&&b.age>b.life&&evt.ph==='none'&&bees.length===1&&(b.st==='perch'||b.st==='flit')){b.st='leave';b.ox=b.x<W/2?-1:1;b.oy=-0.25}   // end of visit
  if(b.st==='play')return playStep(b,n,dt,sc,vmax);
  if(b.st==='leave'){
    const wob=Math.sin(t*7+b.ph)*vmax*0.35;
    b.vx+=(b.ox*vmax*1.1-b.oy*wob-b.vx)*k;b.vy+=(b.oy*vmax*1.1+b.ox*wob-b.vy)*k;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<-sc*5||b.x>W+sc*5||b.y<-sc*5)b.dead=true;
    return fin(b,dt,Math.atan2(b.vy,b.vx));
  }
  if(b.st==='in'){
    const g=pos(b.tg,sc);if(!g){beePick(b);return}
    const dx=g.x-b.x,dy=g.y-b.y,d=Math.hypot(dx,dy)+1e-3,ux=dx/d,uy=dy/d;
    const sp=Math.min(vmax,d*2.4+40),far=clamp(d/(H*0.3));
    const wob=(Math.sin(t*5.5+b.ph)*0.5+Math.sin(t*13+b.ph*2)*0.2)*vmax*0.6*far;
    b.vx+=(ux*sp-uy*wob-b.vx)*k;b.vy+=(uy*sp+ux*wob-b.vy)*k;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    want=d<sc*5?g.a+(b.sgn>0?0:Math.PI):Math.atan2(b.vy,b.vx);
    if(d<sc*0.8){
      b.st='perch';b.vx=b.vy=0;b.stay=3+Math.random()*6;b.fl=0.6;b.nf=2+Math.random()*3;b.wt=0.8+Math.random()*1.5;b.walking=false;
      if(b.tg.k==='stem'&&b.tg.down){b.walking=true;b.wdir=1;b.wt=999}   // heads down the stem into the dark
    }
  }else if(b.st==='perch'){
    const g=pos(b.tg,sc);if(!g){beeFlit(b);return}
    const kk=clamp(dt*16);b.x+=(g.x-b.x)*kk;b.y+=(g.y-b.y)*kk;   // rides the sway, with a touch of lag
    b.wt-=dt;
    if(b.wt<0){
      b.walking=!b.walking;b.wt=b.walking?1+Math.random()*2.5:0.8+Math.random()*2;
      if(b.walking)b.wdir=b.tg.k==='stem'?(Math.random()<0.65?1:-1):(Math.random()<0.5?1:-1);
    }
    if(b.walking){walk(b,dt,sc);b.sgn=b.wdir}
    want=g.a+(b.sgn>0?0:Math.PI);
    b.nf-=dt;if(b.nf<0){b.fl=0.45+Math.random()*0.4;b.nf=2+Math.random()*4}
    if(b.fl>0)b.fl-=dt;
    if(!b.hold)b.stay-=dt;
    if(b.tg.k==='stem'&&b.y>H*0.985){b.st='hid';b.ht=2.5+Math.random()*3}
    else if(b.stay<0&&!(b.tg.k==='stem'&&b.tg.down))beeFlit(b);
  }else{
    const w=b.wp[0];
    if(!w){beePick(b);b.st='in';return}

    }else if(it.t===3){
      const q=it.q;
      ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);ctx.lineTo(q[1][0],q[1][1]);ctx.lineTo(q[2][0],q[2][1]);ctx.lineTo(q[3][0],q[3][1]);ctx.closePath();
      ctx.fillStyle=ctx.strokeStyle=it.col;ctx.lineWidth=0.9;ctx.fill();ctx.stroke();
    }else{
      const pts=it.pts,tip=pts[pts.length-1],k=tip[2];
      ctx.strokeStyle='rgba(248,198,208,.95)';ctx.lineWidth=Math.max(1,(it.pi?0.02:0.011)*k);
      ctx.beginPath();pts.forEach((q,j)=>j?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
      ctx.strokeStyle=it.pi?'#d9e4a0':'#9c2f1c';ctx.lineWidth=Math.max(2,(it.pi?0.04:0.036)*k);
      ctx.beginPath();ctx.moveTo(tip[0],tip[1]);ctx.lineTo(it.pe[0],it.pe[1]);ctx.stroke();
      if(!it.pi){ctx.strokeStyle='rgba(225,120,75,.7)';ctx.lineWidth=Math.max(1,0.012*k);
      ctx.beginPath();ctx.moveTo(tip[0],tip[1]);ctx.lineTo(it.pe[0],it.pe[1]);ctx.stroke();}
    }
  }
  beeStep(dtG);drawBees();
}

let last=0;
function frame(now){
  t=now/1000;
  const dt=Math.min(0.05,Math.max(0.001,t-last));last=t;
  let sum=0,sumT=0;
  for(const p of petals){
    if(p.tgtAt!==null&&now>=p.tgtAt){p.tgt=p.pend;p.tgtAt=null}
    const n=4,h=dt/n;
    for(let i=0;i<n;i++){
      p.vb+=((p.tgt-p.qb)*p.kb-p.vb*p.cb)*h;p.qb+=p.vb*h;
      p.vt+=((p.tgt-p.qt)*p.kt-p.vt*p.ct)*h;p.qt+=p.vt*h;
    }
    sum+=p.qb;sumT+=p.qt;
  }
  E=clamp(sum/NP,0,1);Et=sumT/NP;
  camE+=(targets[stage]-camE)*(1-Math.exp(-2.6*dt));
  if(punchAt!==null&&now>=punchAt){punch.v=5;punchAt=null}
  for(let i=0;i<4;i++){punch.v+=((0-punch.q)*60-punch.v*5)*dt/4;punch.q+=punch.v*dt/4}
  dtG=dt;draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
